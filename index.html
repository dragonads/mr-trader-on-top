    body {

    /* Background */
    .page {

      margin-bottom: 24px;

      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(34,197,94,0.8);
    }

    /* Logo */

      height: 118px;

      border-radius: 28px;

        rgba(255,255,255,0.30),
        rgba(0,132,255,0.30),

      );
      box-shadow:
        0 0 35px rgba(0,132,255,0.13),

    .logo-box img {

      margin: 0 auto 27px;

      background: rgba(255,255,255,0.035);
